<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}FullBinder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white p-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold">FullBinder</h1>
            <nav class="mt-2 space-x-4">
                <a href="{{ url_for('main.home') }}" class="hover:underline">Home</a>
                <a href="{{ url_for('main.about') }}" class="hover:underline">About</a>
            </nav>
        </div>
    </header>
    <main class="p-6 max-w-4xl mx-auto flex-grow w-full">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-slate-500 mt-12 p-4">
        <p>FullBinder &mdash; privacy-first document organizer</p>
    </footer>
</body>

</html>
